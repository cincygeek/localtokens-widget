name: Bug report
description: Something isn't working or the numbers look wrong
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before pasting logs:** LM Studio's server logs contain your prompts. Remove anything private first.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can it be reproduced?
      placeholder: |
        1. Start LocalTokens
        2. Load a model in LM Studio
        3. ...
  - type: input
    id: version
    attributes:
      label: LocalTokens version
      description: Shown at the top of the tray icon's menu.
      placeholder: "0.1.1"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
  - type: input
    id: lmstudio
    attributes:
      label: LM Studio version
      placeholder: "0.3.x"
  - type: textarea
    id: errorlog
    attributes:
      label: error.log
      description: Contents of `%LOCALAPPDATA%\LocalTokens\error.log`, if it exists.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed prompts and other private text from anything I pasted
          required: true
