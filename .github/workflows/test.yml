name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tests in Windows PowerShell 5.1 (what users run)
        shell: powershell
        run: .\tests\Test-LocalTokens.ps1

      - name: Tests in PowerShell 7
        shell: pwsh
        run: .\tests\Test-LocalTokens.ps1
